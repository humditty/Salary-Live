<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日实时赚薪计算器 - 摸鱼治愈神器 | 按秒计算工资</title>
    <meta name="description" content="专为打工人打造的实时工资计算器，输入月薪即可看到每秒赚多少钱。支持午休模式、全屏展示、自动保存，让摸鱼更有动力！">
    <meta name="keywords" content="工资计算器,实时计算,摸鱼神器,时薪计算,打工人工具">
    <meta name="color-scheme" content="dark">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d0d12;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(74, 222, 128, 0.08), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.08), transparent 40%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 30, 35, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 32px;
            color: #4ade80;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 14px;
            color: #a0a0a0;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background-color: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
        }

        /* 优化时间选择框鼠标悬浮和内置图标显示 */
        input[type="time"] {
            font-variant-numeric: tabular-nums;
            cursor: pointer;
        }
        
        input[type="time"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
        }
        
        input[type="time"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        .time-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* 通用隐藏样式 */
        .hidden {
            display: none !important;
        }

        /* 开关通用样式 */
        .switch-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .switch-label {
            font-size: 14px;
            color: #a0a0a0;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3d3d3d;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #4ade80;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .money-display {
            margin: 40px 0;
            text-align: center;
        }

        .money-label {
            font-size: 16px;
            color: #a0a0a0;
            margin-bottom: 8px;
        }

        .money-number {
            font-size: 52px;
            font-weight: 700;
            color: #4ade80;
            word-break: break-all;
            line-height: 1.2;
            cursor: pointer;
            transition: transform 0.2s ease;
            user-select: none;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.2);
        }

        .money-number:hover {
            transform: scale(1.02);
        }

        .status-tip {
            text-align: center;
            font-size: 16px;
            color: #a0a0a0;
            min-height: 24px;
            margin-bottom: 20px;
        }

        .extra-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #3d3d3d;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: #808080;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 16px;
            color: #ffffff;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        /* 全屏显示样式 - 核心优化：强制不换行 */
        .fullscreen-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0a0a0a;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer;
        }

        .fullscreen-modal.show {
            display: flex;
        }

        .fullscreen-money {
            /* 核心不换行配置 */
            white-space: nowrap;
            word-break: keep-all;
            overflow: hidden;
            text-overflow: clip;
            max-width: 90%;
            /* 字号自适应，调小以显得更精致 */
            font-size: clamp(4vw, 12vw, 16vw);
            font-weight: 700;
            color: #4ade80;
            text-align: center;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02e m;
            text-shadow: 0 0 50px rgba(74, 222, 128, 0.25);
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .money-number {
                font-size: 38px;
            }
            .container {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>今日赚薪实时计算器</h1>

        <div class="input-group">
            <label for="monthlySalary">月薪（元）</label>
            <input type="number" id="monthlySalary" placeholder="请输入你的月薪" min="0" step="1000">
        </div>

        <div class="input-group">
            <label for="workDaysType">每月排班制</label>
            <select id="workDaysType">
                <option value="21.75">法定双休 (21.75天)</option>
                <option value="24">大小周 (24天)</option>
                <option value="26">单休 (26天)</option>
            </select>
        </div>

        <div class="input-group">
            <label>上下班时间</label>
            <div class="time-row">
                <div>
                    <input type="time" id="workStart" value="09:00">
                </div>
                <div>
                    <input type="time" id="workEnd" value="18:00">
                </div>
            </div>
        </div>

        <!-- 午休开关模块 -->
        <div class="input-group">
            <div class="label-row">
                <label>午休时间（不计入工作时长）</label>
                <div class="switch-wrapper">
                    <span class="switch-label">不午休！</span>
                    <label class="switch">
                        <input type="checkbox" id="noRestMode">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="time-row" id="restTimeRow">
                <div>
                    <input type="time" id="restStart" value="12:00">
                </div>
                <div>
                    <input type="time" id="restEnd" value="13:00">
                </div>
            </div>
        </div>

        <!-- 新增：金额单位显示开关 -->
        <div class="input-group">
            <div class="label-row">
                <label>金额显示设置</label>
                <div class="switch-wrapper">
                    <span class="switch-label">显示¥符号</span>
                    <label class="switch">
                        <input type="checkbox" id="showUnit" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="input-group">
            <div class="label-row">
                <label>下班后状态</label>
                <div class="switch-wrapper">
                    <span class="switch-label">开启加班模式</span>
                    <label class="switch">
                        <input type="checkbox" id="overtimeMode">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div id="overtimeBonusGroup" class="input-group hidden">
            <label for="overtimeBonus">加班补贴（元/小时）</label>
            <input type="number" id="overtimeBonus" placeholder="没钱加什么班？赶紧下班！" min="0" step="10">
        </div>

        <div class="money-display">
            <div class="money-label">今日已赚（点击全屏）</div>
            <div class="money-number" id="earnedMoney">¥ 0.0000</div>
        </div>

        <div class="status-tip" id="statusTip">请输入月薪，开启今日赚钱计时~</div>

        <div class="extra-info">
            <div class="info-item">
                <div class="info-label">日薪目标</div>
                <div class="info-value" id="daySalary">¥ 0.0000</div>
            </div>
            <div class="info-item">
                <div class="info-item">
                    <div class="info-label">时薪标准</div>
                    <div class="info-value" id="hourSalary">¥ 0.0000</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 全屏显示遮罩层 -->
    <div class="fullscreen-modal" id="fullscreenModal">
        <div class="fullscreen-money" id="fullscreenMoney">¥ 0.0000</div>
    </div>

    <script>
        // 法定月计薪天数
        const MONTHLY_WORK_DAYS = 21.75;
        // 核心元素获取
        const monthlySalaryInput = document.getElementById('monthlySalary');
        const workDaysTypeInput = document.getElementById('workDaysType');
        const workStartInput = document.getElementById('workStart');
        const workEndInput = document.getElementById('workEnd');
        const noRestModeInput = document.getElementById('noRestMode');
        const restStartInput = document.getElementById('restStart');
        const restEndInput = document.getElementById('restEnd');
        const restTimeRow = document.getElementById('restTimeRow');
        const showUnitInput = document.getElementById('showUnit'); 
        const overtimeModeInput = document.getElementById('overtimeMode');
        const overtimeBonusInput = document.getElementById('overtimeBonus');
        const overtimeBonusGroup = document.getElementById('overtimeBonusGroup');
        const earnedMoneyEl = document.getElementById('earnedMoney');
        const statusTipEl = document.getElementById('statusTip');
        const daySalaryEl = document.getElementById('daySalary');
        const hourSalaryEl = document.getElementById('hourSalary');
        // 全屏元素
        const fullscreenModal = document.getElementById('fullscreenModal');
        const fullscreenMoneyEl = document.getElementById('fullscreenMoney');

        // 获取金额单位前缀（核心：统一控制是否显示¥）
        function getUnitPrefix() {
            return showUnitInput.checked ? '¥ ' : '';
        }

        // 午休与加班模式UI切换
        function toggleUIModes() {
            // 午休
            const isNoRest = noRestModeInput.checked;
            restTimeRow.classList.toggle('hidden', isNoRest);
            
            // 加班
            const isOvertime = overtimeModeInput.checked;
            overtimeBonusGroup.classList.toggle('hidden', !isOvertime);
        }

        // 全屏开关
        function openFullscreen() {
            fullscreenModal.classList.add('show');
        }
        function closeFullscreen() {
            fullscreenModal.classList.remove('show');
        }

        // 本地存储加载
        function loadSettings() {
            const saved = localStorage.getItem('salaryCalculatorSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                monthlySalaryInput.value = settings.monthlySalary || '';
                workDaysTypeInput.value = settings.workDaysType || '21.75';
                workStartInput.value = settings.workStart || '09:00';
                workEndInput.value = settings.workEnd || '18:00';
                noRestModeInput.checked = settings.noRestMode || false;
                restStartInput.value = settings.restStart || '12:00';
                restEndInput.value = settings.restEnd || '13:00';
                showUnitInput.checked = settings.showUnit !== undefined ? settings.showUnit : true;
                overtimeModeInput.checked = settings.overtimeMode || false;
                overtimeBonusInput.value = settings.overtimeBonus || '';
                toggleUIModes();
            }
        }

        // 本地存储保存
        function saveSettings() {
            const settings = {
                monthlySalary: monthlySalaryInput.value,
                workDaysType: workDaysTypeInput.value,
                workStart: workStartInput.value,
                workEnd: workEndInput.value,
                noRestMode: noRestModeInput.checked,
                restStart: restStartInput.value,
                restEnd: restEndInput.value,
                showUnit: showUnitInput.checked,
                overtimeMode: overtimeModeInput.checked,
                overtimeBonus: overtimeBonusInput.value
            };
            localStorage.setItem('salaryCalculatorSettings', JSON.stringify(settings));
        }

        // 时间字符串转当天的时间戳 (按基准日期)
        function timeToTimestamp(timeStr, baseDateMs = Date.now()) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            const date = new Date(baseDateMs);
            date.setHours(hours, minutes, 0, 0);
            return date.getTime();
        }

        // 计算核心薪资数据
        function calculateSalaryData() {
            const monthlySalary = parseFloat(monthlySalaryInput.value) || 0;
            const daysInMonth = parseFloat(workDaysTypeInput.value) || 21.75;
            if (monthlySalary <= 0) return { daySalary: 0, hourSalary: 0, workMilliseconds: 0 };

            // 日薪、时薪计算
            const daySalary = monthlySalary / daysInMonth;
            
            // 强大的跨天/夜班容错处理逻辑
            const now = Date.now();
            let baseDate = now;
            const startRaw = timeToTimestamp(workStartInput.value, baseDate);
            const endRaw = timeToTimestamp(workEndInput.value, baseDate);
            
            let workStartTs = startRaw;
            let workEndTs = endRaw;

            if (endRaw <= startRaw) { // 是夜班
                if (now < endRaw) {
                    baseDate -= 86400000;
                    workStartTs = timeToTimestamp(workStartInput.value, baseDate);
                    workEndTs = timeToTimestamp(workEndInput.value, baseDate + 86400000);
                } else {
                    workEndTs = timeToTimestamp(workEndInput.value, baseDate + 86400000);
                }
            } 

            let restStartTs = timeToTimestamp(restStartInput.value, baseDate);
            let restEndTs = timeToTimestamp(restEndInput.value, baseDate);
            
            if (restStartTs < workStartTs) restStartTs += 86400000;
            if (restEndTs < restStartTs) restEndTs += 86400000;

            // 总工作时长（根据不午休模式判断是否扣除午休）
            let totalWorkMs;
            if (noRestModeInput.checked) {
                totalWorkMs = workEndTs - workStartTs;
            } else {
                totalWorkMs = (workEndTs - workStartTs) - (restEndTs - restStartTs);
            }

            const totalWorkHours = totalWorkMs / (1000 * 60 * 60);
            const hourSalary = totalWorkHours > 0 ? daySalary / totalWorkHours : 0;

            return { daySalary, hourSalary, totalWorkMs, workStartTs, workEndTs, restStartTs, restEndTs };
        }

        // 随机提示语配置
        const TIPS = {
            noSalary: [
                '请输入月薪，开启今日赚钱计时~',
                '填好月薪，这世界才能为你计算价值~',
                '不填月薪怎么知道你有多宝贵呢？'
            ],
            beforeWork: [
                '还没到上班时间，今天也要加油搞钱呀~',
                '早起的鸟儿有虫吃，稍微等一等就有钱啦~',
                '别急，钱还没开始进账呢，先吃个早餐吧！',
                '好不情愿啊，但想想小钱钱，还是打起精神吧~'
            ],
            working: [
                '上班中！就算摸鱼也在赚钱，稳住！',
                '正在为您自动赚钱，请保持呼吸。',
                '滴答滴答，每一秒都是金钱的声音...',
                '老板以为你在专注，其实你在看着余额缓慢增长~',
                '只要稳稳当当地坐着，钱就像自来水流进钱包。',
                '放轻松，深呼吸，你的财富正在增加。',
                '转转手腕，活动一下颈椎，不要亏待了身体~'
            ],
            workingNoRest: [
                '不午休模式！全程带薪，摸鱼也在疯狂赚钱~',
                '卷王附体！一分一秒都不放过！',
                '中午不睡，下午接着暴富！',
                '好累，但是看到余额在动就充满了力量...'
            ],
            resting: [
                '午休时间！带薪休息，钱还在兜里，太舒服了~',
                '躺平中... 别忘了这是带薪的！',
                '干饭人干饭魂，钱照赚不误！',
                '休息一会吧，打工人的续航全靠这午休。'
            ],
            afterWork: [
                '今日打工结束！摸鱼也赚了一天的钱，太爽啦~',
                '脱下工作服，下班啦！快跑！',
                '打卡下班！明天的窝囊气留给明天受。',
                '结束了充实（摸鱼）的一天，快去享受生活吧！'
            ]
        };

        // 提示语状态管理
        let currentStatus = null;
        let currentTip = '';
        let lastTipChangeTime = 0;

        // 获取随机提示语（每15秒更新或状态改变时更新）
        function getRandomTip(status) {
            const now = Date.now();
            if (status !== currentStatus || now - lastTipChangeTime > 15000) {
                const tipsArray = TIPS[status] || TIPS.working;
                let newTip = tipsArray[Math.floor(Math.random() * tipsArray.length)];
                // 确保连续两次提示语不同（如果有多个可选）
                if (tipsArray.length > 1 && newTip === currentTip) {
                    newTip = tipsArray[(tipsArray.indexOf(currentTip) + 1) % tipsArray.length];
                }
                currentStatus = status;
                currentTip = newTip;
                lastTipChangeTime = now;
            }
            return currentTip;
        }

        // 计算已工作时长（毫秒）
        function getWorkedMs(data) {
            const now = Date.now();
            const { workStartTs, workEndTs, restStartTs, restEndTs } = data;

            // 还没到上班时间
            if (now < workStartTs) {
                return { workedMs: 0, status: 'beforeWork' };
            }
            // 已经下班了
            if (now > workEndTs) {
                if (overtimeModeInput.checked) {
                    const extraMs = now - workEndTs;
                    const overtimeBonus = parseFloat(overtimeBonusInput.value) || 0;
                    
                    if (overtimeBonus <= 0) {
                        return { workedMs: data.totalWorkMs, status: 'afterWork', tip: '【警告】检测到无偿加班！没钱加什么班？赶紧下班回家！' };
                    }
                    
                    // 加班费计算：基础时薪 + 额外的加班补贴
                    const overtimeEarnedMs = data.totalWorkMs + (extraMs * (data.hourSalary + overtimeBonus) / data.hourSalary);
                    // 为了简化逻辑，这里直接返回金额倍率后的“虚拟毫秒”，或者在update中处理金额。
                    // 修正：我们直接返回 calculatedMs。这里为了保持 update 代码简洁，我们计算一个等效的工作时长。
                    const totalEquivMs = data.totalWorkMs + (extraMs * (data.hourSalary + overtimeBonus) / data.hourSalary);
                    
                    return { 
                        workedMs: totalEquivMs, 
                        status: 'workingNoRest', 
                        tip: `加班敛财中！当前额外补贴 ¥${overtimeBonus}/小时，每秒都在赚！` 
                    };
                }
                return { workedMs: data.totalWorkMs, status: 'afterWork' };
            }

            // 非不午休模式，执行午休时段逻辑
            if (!noRestModeInput.checked) {
                // 午休时间
                if (now >= restStartTs && now <= restEndTs) {
                    const workedBeforeRest = restStartTs - workStartTs;
                    return { workedMs: workedBeforeRest, status: 'resting' };
                }
                // 上班中（午休前）
                if (now < restStartTs) {
                    const workedMs = now - workStartTs;
                    return { workedMs, status: 'working' };
                }
                // 上班中（午休后）
                const workedBeforeRest = restStartTs - workStartTs;
                const workedAfterRest = now - restEndTs;
                return { workedMs: workedBeforeRest + workedAfterRest, status: 'working' };
            } else {
                // 不午休模式，全程正常计薪
                const workedMs = now - workStartTs;
                return { workedMs, status: 'workingNoRest' };
            }
        }

        // 实时更新函数
        function update() {
            const salaryData = calculateSalaryData();
            const { daySalary, hourSalary } = salaryData;
            const unitPrefix = getUnitPrefix(); // 统一获取单位前缀

            // 更新基础薪资显示（4位小数+动态单位）
            daySalaryEl.textContent = `${unitPrefix}${daySalary.toFixed(4)}`;
            hourSalaryEl.textContent = `${unitPrefix}${hourSalary.toFixed(4)}`;

            // 无月薪时的提示
            if (daySalary <= 0) {
                const zeroText = `${unitPrefix}0.0000`;
                earnedMoneyEl.textContent = zeroText;
                fullscreenMoneyEl.textContent = zeroText;
                statusTipEl.textContent = getRandomTip('noSalary');
                return;
            }

            // 计算已赚金额
            const { workedMs, status } = getWorkedMs(salaryData);
            const workedHours = workedMs / (1000 * 60 * 60);
            const earnedMoney = workedHours * hourSalary;
            const moneyText = `${unitPrefix}${earnedMoney.toFixed(4)}`;

            // 同步更新主界面&全屏的金额
            earnedMoneyEl.textContent = moneyText;
            fullscreenMoneyEl.textContent = moneyText;
            statusTipEl.textContent = getRandomTip(status);
        }

        // 初始化
        loadSettings();
        toggleUIModes();
        update();

        // 监听输入变化，保存设置并更新
        const allInputs = [monthlySalaryInput, workDaysTypeInput, workStartInput, workEndInput, restStartInput, restEndInput, overtimeBonusInput];
        allInputs.forEach(input => {
            input.addEventListener('input', () => {
                saveSettings();
            });
        });

        // 监听各种开关
        [noRestModeInput, showUnitInput, overtimeModeInput].forEach(switchEl => {
            switchEl.addEventListener('change', () => {
                toggleUIModes();
                saveSettings();
            });
        });

        // 监听全屏点击事件
        earnedMoneyEl.addEventListener('click', openFullscreen);
        fullscreenModal.addEventListener('click', closeFullscreen);
        // 按ESC键退出全屏
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeFullscreen();
            }
        });

        // 极限丝滑刷新：使用 requestAnimationFrame 代替 setInterval
        function loop() {
            update();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
